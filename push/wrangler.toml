name = "moodle-task-push"
account_id = "5b6913e04b60fcfeb7dd7c2eba90586a"   # not a secret: it only says which Cloudflare account; the token is in GitHub Secrets
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# community management: the SHA-256 of a one-time code ("admin:" + code). Only the hash is here; the code was given to the owner once, works once,
# and every admin call is still checked on the server against the admins table. A new code = a new hash here.
[vars]
ADMIN_CLAIM_H = "3cfc5ec989bf12aeb80183e13b6ce08c016765bb78a5790c1f098aae798209ae"

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "Device"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

[[durable_objects.bindings]]
name = "FEEDS"
class_name = "Feed"

[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

[[durable_objects.bindings]]
name = "FILES"
class_name = "Files"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device", "Keys"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Feed"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Community"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Files"]

# ---------- the test copy (for helpers working on a fork): same code, its own empty data, its own address ----------
# https://moodle-task-push-dev.aorizoro.workers.dev – the app uses it automatically when it is NOT served from aorizoro.github.io.
# Nobody but the owner can deploy it (the Cloudflare token is a repository secret that pull requests never get).
[env.dev]
name = "moodle-task-push-dev"
workers_dev = true
vars = { DEV_ORIGIN = "*.github.io" }

[[env.dev.durable_objects.bindings]]
name = "DEVICES"
class_name = "Device"

[[env.dev.durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

[[env.dev.durable_objects.bindings]]
name = "FEEDS"
class_name = "Feed"

[[env.dev.durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

[[env.dev.durable_objects.bindings]]
name = "FILES"
class_name = "Files"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Device", "Keys"]

[[env.dev.migrations]]
tag = "v2"
new_sqlite_classes = ["Feed"]

[[env.dev.migrations]]
tag = "v3"
new_sqlite_classes = ["Community"]

[[env.dev.migrations]]
tag = "v4"
new_sqlite_classes = ["Files"]
